CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y 

# In a ZMK split setup, the number of Host (PC/Phone) Bluetooth profiles is calculated as:
# Host Profiles = CONFIG_BT_MAX_PAIRED - CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS
# Since a standard split has 1 peripheral (the right half), CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS defaults to 1.
# By setting CONFIG_BT_MAX_PAIRED to 1, we force Host Profiles to 0 (1 - 1 = 0).
# This entirely disables host BLE advertising. The left half will exclusively look for the right half,
# making itself completely invisible/undiscoverable to PCs/Phones, forcing communication over wired USB.
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
